<!-- =========================================================================
     MR.html — Automation Market Return Administration
     INPUT ADMIN → VALIDASI → APPROVAL SALES → CREATE SO → MONITORING
     ========================================================================= -->
<section class="page" id="page-mr">

  <div class="page-head">
    <div>
      <h1 class="page-title">MR Administration</h1>
      <p class="page-head__sub">
        Otomasi administrasi Market Return dari input sampai pembuatan SO
      </p>
    </div>
    <div class="page-actions">
      <button class="btn btn--secondary btn--sm" data-mr="export">Export CSV</button>
      <button class="btn btn--primary btn--sm" data-mr="create" hidden>
        Input MR
      </button>
    </div>
  </div>

  <div class="grid grid--kpi" data-mr-kpi style="margin-bottom:16px"></div>

  <div data-filter-slot></div>

  <div class="card">
    <div class="card__head">
      <div>
        <div class="card-title">Dokumen Market Return</div>
        <div class="caption" data-mr-count>—</div>
      </div>
      <div class="segmented" data-mr-quick>
        <button data-quick="" class="is-active">Semua</button>
        <button data-quick="INPUT">Input</button>
        <button data-quick="WAITING_APPROVAL">Approval</button>
        <button data-quick="APPROVED">Siap SO</button>
        <button data-quick="COMPLETED">Selesai</button>
      </div>
    </div>
    <div class="card__body card__body--flush"><div data-mr-table></div></div>
    <div data-mr-pagination></div>
  </div>
</section>

<script>
definePage('mr', {
  title: 'MR Administration',
  breadcrumb: ['MR Dairy', 'MR Administration'],
  permission: 'mr.view',
  filters: ['dateRange', 'region', 'account', 'mrStatus', 'search'],

  mount: function (ctx) {
    ctx.root.__state = { page: 1 };
    ctx.root.addEventListener('click', function (event) {
      var btn = event.target.closest('[data-mr]');
      if (!btn) return;
      var action = btn.getAttribute('data-mr');
      if (action === 'create') MR.openForm(ctx);
      if (action === 'export') MR.exportCsv(ctx);
    });
    ctx.all('[data-mr-quick] button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        ctx.all('[data-mr-quick] button').forEach(function (b) { b.classList.toggle('is-active', b === btn); });
        ctx.root.__state.quick = btn.getAttribute('data-quick');
        ctx.root.__state.page = 1;
        MR.load(ctx);
      });
    });
  },

  load: function (ctx) {
    var createBtn = ctx.el('[data-mr="create"]');
    if (createBtn) createBtn.hidden = !App.can('mr.create');
    MR.load(ctx);
    if (ctx.params && ctx.params.mrId) {
      var id = ctx.params.mrId;
      ctx.params.mrId = null;
      setTimeout(function () { MR.openDetail(ctx, id); }, 300);
    }
  }
});

var MR = {

  load: function (ctx) {
    var state = ctx.root.__state;
    ctx.el('[data-mr-table]').innerHTML = UI.skeletonTable(8, 6);
    ctx.el('[data-mr-kpi]').innerHTML = UI.skeletonKpi(4);

    var filters = Object.assign({}, ctx.filters());
    if (state.quick) filters.status = state.quick;

    Api.call('mr.list', {
      filters: filters, page: state.page, pageSize: App.state.settings.pageSize || 25
    }).then(function (data) {
      ctx.root.__data = data;
      paint(function () {
        MR.renderKpi(ctx, data.summary);
        MR.renderTable(ctx, data);
      });
      App.setNavBadge('mr', data.summary.waitingApproval || 0);
    }).catch(function (err) {
      Api.handle(err, 'Gagal memuat data MR');
      ctx.el('[data-mr-kpi]').innerHTML = '';
      ctx.el('[data-mr-table]').innerHTML = UI.alert('danger', 'Data tidak dapat dimuat', err.message || '');
    });
  },

  renderKpi: function (ctx, s) {
    ctx.el('[data-mr-kpi]').innerHTML = [
      UI.kpiCard({
        label: 'Pending MR', valueHtml: UI.fmt.number(s.pending), unit: 'dok', iconName: 'clock',
        sub: UI.fmt.number(s.totalQty) + ' qty tercatat'
      }),
      UI.kpiCard({
        label: 'Menunggu Approval', valueHtml: UI.fmt.number(s.waitingApproval), unit: 'dok',
        iconName: 'shield', accent: true, sub: 'keputusan Sales'
      }),
      UI.kpiCard({
        label: 'SO Dibuat', valueHtml: UI.fmt.number(s.soCreated), unit: 'dok', iconName: 'file',
        sub: UI.fmt.number(s.completed) + ' selesai'
      }),
      UI.kpiCard({
        label: 'Missed PO', valueHtml: UI.fmt.number(s.missedPo), unit: 'dok', iconName: 'alert',
        sub: s.overdue + ' dokumen lewat SLA'
      })
    ].join('');
  },

  renderTable: function (ctx, data) {
    ctx.el('[data-mr-count]').textContent = UI.fmt.number(data.meta.total) + ' dokumen · on time '
      + UI.fmt.decimal(data.summary.onTimeRate, 1) + '%';

    if (!data.rows.length) {
      ctx.el('[data-mr-table]').innerHTML = UI.emptyState({
        icon: 'clipboard', title: 'Belum ada dokumen MR',
        desc: 'Mulai administrasi Market Return dengan menginput dokumen pertama.',
        actionLabel: App.can('mr.create') ? 'Input MR' : '', action: 'create-mr'
      });
      ctx.el('[data-mr-pagination]').innerHTML = '';
      var emptyBtn = ctx.el('[data-empty-action="create-mr"]');
      if (emptyBtn) emptyBtn.addEventListener('click', function () { MR.openForm(ctx); });
      return;
    }

    ctx.el('[data-mr-table]').innerHTML = UI.table({
      compact: true,
      columns: [
        {
          key: 'MR_ID', label: 'MR', render: function (r) {
            return '<span class="mono t-strong">' + UI.escapeHtml(r.MR_ID) + '</span>'
              + '<span class="table__cell-sub">' + UI.fmt.date(r.MR_DATE) + '</span>';
          }
        },
        {
          key: 'accountName', label: 'Account / SKU', render: function (r) {
            return '<span class="t-strong">' + UI.escapeHtml(r.accountName) + '</span>'
              + '<span class="table__cell-sub">' + UI.escapeHtml(r.skuName) + '</span>';
          }
        },
        {
          key: 'RETURN_QTY', label: 'Qty', align: 'right', render: function (r) {
            return '<span class="t-strong">' + UI.fmt.number(r.RETURN_QTY) + '</span>'
              + '<span class="table__cell-sub">' + UI.fmt.compactCurrency(r.RETURN_VALUE) + '</span>';
          }
        },
        {
          key: 'PICKUP_DATE', label: 'Penarikan', render: function (r) {
            return r.PICKUP_DATE ? UI.fmt.date(r.PICKUP_DATE)
              : '<span class="text-warning" style="font-weight:600">belum dijadwalkan</span>';
          }
        },
        {
          key: 'CUTOFF_DATE', label: 'Cutoff', render: function (r) {
            var days = r.daysToCutoff;
            var tone = days === null ? '' : (days < 0 ? 'text-danger' : (days <= 2 ? 'text-warning' : ''));
            return UI.fmt.date(r.CUTOFF_DATE)
              + '<span class="table__cell-sub ' + tone + '">'
              + (days === null ? '' : (days < 0 ? 'lewat ' + Math.abs(days) + ' hari' : 'sisa ' + days + ' hari'))
              + '</span>';
          }
        },
        {
          key: 'VALIDATION_STATUS', label: 'Validasi', align: 'center',
          render: function (r) { return UI.statusBadge(r.VALIDATION_STATUS); }
        },
        {
          key: 'SO_NUMBER', label: 'SO', render: function (r) {
            return r.SO_NUMBER ? '<span class="mono">' + UI.escapeHtml(r.SO_NUMBER) + '</span>'
              : '<span class="text-muted">—</span>';
          }
        },
        { key: 'MR_STATUS', label: 'Status', align: 'center', render: function (r) { return UI.statusBadge(r.MR_STATUS); } },
        {
          key: '_act', label: '', align: 'right', render: function (r) {
            return '<div class="table__actions"><button class="btn btn--ghost btn--sm" data-mr-open="'
              + UI.escapeHtml(r.MR_ID) + '">' + UI.icon('chevron-right', 14) + '</button></div>';
          }
        }
      ],
      rows: data.rows,
      rowAttrs: function (row) {
        return 'style="cursor:pointer" data-mr-row="' + UI.escapeHtml(row.MR_ID) + '"'
          + (row.missedPo ? ' title="Missed PO: melewati cutoff tagihan"' : '');
      }
    });
    ctx.el('[data-mr-pagination]').innerHTML = UI.pagination(data.meta);

    ctx.all('[data-mr-row]').forEach(function (tr) {
      tr.addEventListener('click', function () { MR.openDetail(ctx, tr.getAttribute('data-mr-row')); });
    });
    ctx.all('[data-mr-pagination] .page-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        ctx.root.__state.page = Number(btn.getAttribute('data-page'));
        MR.load(ctx);
      });
    });
  },

  /* ------------------------------------------------------------------ */
  /* STEP 1 — Form input                                                 */
  /* ------------------------------------------------------------------ */
  openForm: function (ctx, existing) {
    Api.call('mr.formOptions', {}).then(function (options) {
      var d = options.defaults;
      Modal.open({
        large: true,
        title: existing ? 'Ubah dokumen MR' : 'Input MR',
        sub: 'Step 1 dari 5 · Input Admin',
        body: [
          '<div class="stack">',
          UI.progressTracker(['Input', 'Validasi', 'Approval', 'Create SO', 'Monitoring'], 0),
          '<div class="field-row">',
          '<div class="field"><label class="field__label">Account <span class="text-danger">*</span></label>',
          '<select class="select" id="mr-account"><option value="">Pilih account</option>'
          + options.accounts.map(function (a) {
            return '<option value="' + a.id + '"' + (existing && existing.ACCOUNT_ID === a.id ? ' selected' : '')
              + '>' + UI.escapeHtml(a.name) + ' (' + UI.escapeHtml(a.code) + ')</option>';
          }).join('') + '</select></div>',
          '<div class="field"><label class="field__label">SKU <span class="text-danger">*</span></label>',
          '<select class="select" id="mr-sku"><option value="">Pilih SKU</option>'
          + options.skus.map(function (s) {
            return '<option value="' + s.id + '" data-shelf="' + s.shelfLife + '"'
              + (existing && existing.SKU_ID === s.id ? ' selected' : '') + '>'
              + UI.escapeHtml(s.name) + '</option>';
          }).join('') + '</select></div>',
          '</div>',

          '<div class="field-row">',
          '<div class="field"><label class="field__label">Return Qty <span class="text-danger">*</span></label>',
          '<input class="input" type="number" min="1" step="1" id="mr-qty" value="'
          + (existing ? existing.RETURN_QTY : '') + '" placeholder="0"></div>',
          '<div class="field"><label class="field__label">Tanggal MR <span class="text-danger">*</span></label>',
          '<input class="input" type="date" id="mr-date" value="'
          + (existing ? existing.MR_DATE : d.mrDate) + '"></div>',
          '<div class="field"><label class="field__label">Alasan return</label>',
          '<select class="select" id="mr-reason">'
          + options.reasons.map(function (r) {
            return '<option value="' + r + '"' + (existing && existing.RETURN_REASON === r ? ' selected' : '') + '>'
              + r.replace(/_/g, ' ') + '</option>';
          }).join('') + '</select></div>',
          '</div>',

          '<div class="field-row">',
          '<div class="field"><label class="field__label">Expiry Date</label>',
          '<input class="input" type="date" id="mr-expiry" value="' + (existing ? existing.EXPIRY_DATE : '') + '">',
          '<span class="field__hint">Dipakai menentukan kewajiban BAP (' + UI.escapeHtml(d.bapRule)
          + ', fresh ≥ ' + d.bapFreshDays + ' hari).</span></div>',
          '<div class="field"><label class="field__label">Pickup Date</label>',
          '<input class="input" type="date" id="mr-pickup" value="'
          + (existing ? existing.PICKUP_DATE : d.suggestedPickupDate) + '">',
          '<span class="field__hint">SLA penarikan ' + d.pickupSlaDays + ' hari dari tanggal MR.</span></div>',
          '<div class="field"><label class="field__label">PIC</label>',
          '<input class="input" id="mr-pic" value="' + UI.escapeHtml(existing ? existing.PIC : '')
          + '" placeholder="Penanggung jawab"></div>',
          '</div>',

          '<div class="field"><label class="field__label">Catatan</label>',
          '<textarea class="textarea" id="mr-remark" placeholder="Informasi tambahan untuk Sales / Finance">'
          + UI.escapeHtml(existing ? existing.REMARK : '') + '</textarea></div>',

          UI.alert('info', 'Cutoff otomatis',
            'Cutoff potong tagihan dihitung otomatis = tanggal MR + ' + d.cutoffDays
            + ' hari, sesuai SOP yang berlaku.'),
          '<div id="mr-form-error"></div>',
          '</div>'
        ].join(''),
        actions: [
          { label: 'Batal', tone: 'secondary' },
          {
            label: existing ? 'Simpan perubahan' : 'Simpan & validasi', tone: 'primary', close: false,
            onClick: function (body) {
              var payload = {
                accountId: qs('#mr-account', body).value,
                skuId: qs('#mr-sku', body).value,
                returnQty: qs('#mr-qty', body).value,
                mrDate: qs('#mr-date', body).value,
                returnReason: qs('#mr-reason', body).value,
                expiryDate: qs('#mr-expiry', body).value,
                pickupDate: qs('#mr-pickup', body).value,
                pic: qs('#mr-pic', body).value,
                remark: qs('#mr-remark', body).value
              };
              if (existing) payload.mrId = existing.MR_ID;
              Api.call(existing ? 'mr.update' : 'mr.create', payload).then(function (res) {
                Modal.close();
                Toast.success(existing ? 'MR diperbarui' : 'MR tersimpan',
                  res.mr.MR_ID + ' · validasi: ' + res.validation.status);
                MR.load(ctx);
                MR.openDetail(ctx, res.mr.MR_ID);
              }).catch(function (err) {
                qs('#mr-form-error', body).innerHTML = UI.alert('danger', 'Tidak dapat disimpan', err.message);
              });
              return false;
            }
          }
        ],
        onMount: function (body) {
          var skuSelect = qs('#mr-sku', body);
          var expiry = qs('#mr-expiry', body);
          var mrDate = qs('#mr-date', body);
          var suggestExpiry = function () {
            var option = skuSelect.options[skuSelect.selectedIndex];
            if (!option || !option.getAttribute('data-shelf') || expiry.value) return;
            var shelf = Number(option.getAttribute('data-shelf')) || 0;
            if (!shelf || !mrDate.value) return;
            var date = new Date(mrDate.value);
            date.setDate(date.getDate() + Math.round(shelf * .2));
            expiry.value = date.toISOString().substring(0, 10);
          };
          skuSelect.addEventListener('change', suggestExpiry);
        }
      });
    }).catch(function (err) { Api.handle(err, 'Gagal memuat form'); });
  },

  /* ------------------------------------------------------------------ */
  /* Detail drawer + aksi workflow                                       */
  /* ------------------------------------------------------------------ */
  openDetail: function (ctx, mrId) {
    Drawer.open({
      wide: true, title: 'Dokumen MR', sub: mrId,
      body: '<div class="stack">' + UI.skeletonTable(6, 2) + '</div>'
    });
    Api.call('mr.detail', { mrId: mrId }).then(function (data) {
      MR.renderDetail(ctx, data);
    }).catch(function (err) {
      Drawer.setBody(UI.alert('danger', 'Gagal memuat detail', err.message || ''));
    });
  },

  renderDetail: function (ctx, data) {
    var mr = data.mr;
    var v = data.validation;
    var stepIndex = mr.MR_STATUS === 'REJECTED' ? 2 : mr.stepIndex;

    Drawer.open({
      wide: true,
      title: mr.MR_ID,
      sub: mr.accountName + ' · ' + mr.skuName,
      body: [
        '<div class="stack">',
        '<div class="panel">' + UI.progressTracker(
          ['Input', 'Validasi', 'Approval', 'Approved', 'Create SO', 'Pickup', 'Selesai'], stepIndex) + '</div>',

        mr.MR_STATUS === 'REJECTED' ? UI.alert('danger', 'Dokumen ditolak', mr.REJECT_REASON || '') : '',
        mr.missedPo ? UI.alert('warning', 'Missed PO',
          'Dokumen melewati cutoff potong tagihan. Pemotongan tagihan masuk periode berikutnya.') : '',

        '<div class="panel"><div class="meta-grid">',
        UI.metaItem('Status', UI.statusBadge(mr.MR_STATUS)),
        UI.metaItem('Return Qty', UI.fmt.number(mr.RETURN_QTY) + ' ' + UI.escapeHtml(mr.unit || '')),
        UI.metaItem('Nilai Return', UI.fmt.currency(mr.RETURN_VALUE)),
        UI.metaItem('Alasan', UI.fmt.label(mr.RETURN_REASON)),
        UI.metaItem('Tanggal MR', UI.fmt.date(mr.MR_DATE)),
        UI.metaItem('Expiry', UI.fmt.date(mr.EXPIRY_DATE)),
        UI.metaItem('Pickup', mr.PICKUP_DATE ? UI.fmt.date(mr.PICKUP_DATE)
          : '<span class="text-warning">belum dijadwalkan</span>'),
        UI.metaItem('Cutoff', UI.fmt.date(mr.CUTOFF_DATE) + (mr.daysToCutoff === null ? ''
          : ' <span class="caption">(' + (mr.daysToCutoff < 0 ? 'lewat ' + Math.abs(mr.daysToCutoff)
            : 'sisa ' + mr.daysToCutoff) + ' hari)</span>')),
        UI.metaItem('BAP', mr.BAP_REQUIRED ? UI.statusBadge(mr.BAP_STATUS) : UI.badge('TIDAK WAJIB', 'muted')),
        UI.metaItem('Approval Sales', UI.statusBadge(mr.SALES_APPROVAL)),
        UI.metaItem('Nomor SO', mr.SO_NUMBER ? '<span class="mono">' + UI.escapeHtml(mr.SO_NUMBER) + '</span>' : '—'),
        UI.metaItem('PIC', UI.escapeHtml(mr.PIC || '—')),
        '</div></div>',

        '<div class="card"><div class="card__head">',
        '<div><div class="card-title">Hasil validasi otomatis</div>',
        '<div class="caption">Sistem memeriksa duplikasi, kelengkapan, anomali dan SOP</div></div>',
        UI.statusBadge(v.status), '</div>',
        '<div class="card__body" style="padding-top:4px">',
        v.checks.map(UI.checkItem).join(''),
        '</div></div>',

        '<div class="card"><div class="card__head"><div class="card-title">Riwayat proses</div></div>',
        '<div class="card__body"><div class="timeline">',
        data.timeline.map(function (step) {
          return '<div class="timeline__item"><span class="timeline__dot' + (step.done ? ' is-done' : '') + '">'
            + (step.done ? UI.icon('check', 9) : '') + '</span>'
            + '<div><div class="timeline__label">' + UI.escapeHtml(step.label) + '</div>'
            + '<div class="timeline__meta">' + (step.at ? UI.fmt.dateTime(step.at) : 'belum diproses')
            + (step.by ? ' · ' + UI.escapeHtml(step.by) : '')
            + (step.reason ? ' · ' + UI.escapeHtml(step.reason) : '') + '</div></div></div>';
        }).join(''),
        '</div></div></div>',

        data.history.length ? '<div class="card"><div class="card__head">'
          + '<div class="card-title">Audit trail dokumen</div></div><div class="card__body">'
          + '<div class="timeline">' + data.history.map(function (log) {
            return '<div class="timeline__item"><span class="timeline__dot is-done">'
              + UI.icon('check', 9) + '</span><div><div class="timeline__label">'
              + UI.fmt.label(log.action) + '</div><div class="timeline__meta">'
              + UI.escapeHtml(log.description) + '</div><div class="timeline__meta">'
              + UI.escapeHtml(log.user) + ' · ' + UI.fmt.dateTime(log.timestamp) + '</div></div></div>';
          }).join('') + '</div></div></div>' : '',
        '</div>'
      ].join(''),
      footer: MR.actionButtons(mr)
    });

    qsa('[data-mr-action]').forEach(function (btn) {
      btn.addEventListener('click', function () { MR.runAction(ctx, btn.getAttribute('data-mr-action'), mr); });
    });
  },

  actionButtons: function (mr) {
    var buttons = ['<button class="btn btn--ghost" data-mr-action="close">Tutup</button>'];
    var status = mr.MR_STATUS;

    if (['INPUT', 'VALIDATED'].indexOf(status) !== -1 && App.can('mr.update')) {
      buttons.push('<button class="btn btn--secondary" data-mr-action="edit">Ubah</button>');
    }
    if (['INPUT', 'VALIDATED'].indexOf(status) !== -1 && App.can('mr.validate')) {
      buttons.push('<button class="btn btn--secondary" data-mr-action="validate">Validasi ulang</button>');
    }
    if (status === 'VALIDATED' && App.can('mr.update')) {
      buttons.push('<button class="btn btn--primary" data-mr-action="submit">Kirim ke Sales</button>');
    }
    if (status === 'WAITING_APPROVAL' && App.can('mr.approve')) {
      buttons.push('<button class="btn btn--danger" data-mr-action="reject">Tolak</button>');
      buttons.push('<button class="btn btn--success" data-mr-action="approve">Approve</button>');
    }
    if (status === 'APPROVED' && App.can('mr.createSO')) {
      buttons.push('<button class="btn btn--primary" data-mr-action="createSO">Create SO</button>');
    }
    if (['SO_CREATED', 'APPROVED'].indexOf(status) !== -1 && App.can('mr.schedule')) {
      buttons.push('<button class="btn btn--secondary" data-mr-action="schedule">Jadwal penarikan</button>');
    }
    if (status === 'PICKUP_SCHEDULED' && App.can('mr.complete')) {
      buttons.push('<button class="btn btn--success" data-mr-action="complete">Tandai selesai</button>');
    }
    return buttons.join('');
  },

  runAction: function (ctx, action, mr) {
    var refresh = function (message) {
      Toast.success('Berhasil', message);
      MR.load(ctx);
      MR.openDetail(ctx, mr.MR_ID);
    };

    if (action === 'close') { Drawer.close(); return; }

    if (action === 'edit') {
      Drawer.close();
      MR.openForm(ctx, mr);
      return;
    }

    if (action === 'validate') {
      Api.call('mr.validate', { mrId: mr.MR_ID }).then(function (res) {
        refresh('Validasi selesai dengan status ' + res.validation.status + '.');
      }).catch(function (err) { Api.handle(err, 'Validasi gagal'); });
      return;
    }

    if (action === 'submit') {
      Api.call('mr.submit', { mrId: mr.MR_ID }).then(function () {
        refresh('Dokumen dikirim untuk approval Sales.');
      }).catch(function (err) { Api.handle(err, 'Gagal mengirim approval'); });
      return;
    }

    if (action === 'approve') {
      Modal.confirm({
        title: 'Approve dokumen MR',
        sub: mr.MR_ID + ' · ' + mr.accountName,
        body: '<div class="stack">'
          + UI.alert('info', 'Setelah disetujui',
            'Dokumen dapat diproses menjadi SO otomatis dengan format SO-MR-YYYYMMDD-XXXX.')
          + '<div class="field"><label class="field__label">Catatan approval</label>'
          + '<textarea class="textarea" id="approve-note" placeholder="Opsional"></textarea></div>'
          + '<label class="checkbox"><input type="checkbox" id="approve-so"'
          + (App.can('mr.createSO') ? ' checked' : ' disabled') + '> Langsung buat SO setelah approve</label>'
          + '</div>',
        confirmLabel: 'Approve',
        tone: 'success',
        validate: function (body) {
          return { note: qs('#approve-note', body).value, autoSO: qs('#approve-so', body).checked };
        }
      }).then(function (result) {
        if (!result) return;
        Api.call('mr.approve', {
          mrId: mr.MR_ID, note: result.note, autoCreateSO: result.autoSO
        }).then(function (res) {
          refresh(res.so ? 'Approved. SO ' + res.so.soNumber + ' dibuat.'
            : (res.soError ? 'Approved. SO belum dibuat: ' + res.soError : 'Dokumen disetujui.'));
        }).catch(function (err) { Api.handle(err, 'Approval gagal'); });
      });
      return;
    }

    if (action === 'reject') {
      Modal.confirm({
        title: 'Tolak dokumen MR',
        sub: mr.MR_ID + ' · ' + mr.accountName,
        body: '<div class="field"><label class="field__label">Alasan penolakan <span class="text-danger">*</span></label>'
          + '<textarea class="textarea" id="mr-reject-reason" placeholder="Jelaskan alasan penolakan"></textarea>'
          + '<span class="field__hint">Alasan wajib diisi dan tercatat pada audit log.</span></div>',
        confirmLabel: 'Tolak dokumen', tone: 'danger',
        validate: function (body) {
          var reason = qs('#mr-reject-reason', body).value.trim();
          if (!reason) { Toast.warning('Alasan wajib diisi'); return false; }
          return reason;
        }
      }).then(function (reason) {
        if (!reason) return;
        Api.call('mr.reject', { mrId: mr.MR_ID, reason: reason }).then(function () {
          refresh('Dokumen ditolak.');
        }).catch(function (err) { Api.handle(err, 'Penolakan gagal'); });
      });
      return;
    }

    if (action === 'createSO') {
      Api.call('mr.createSO', { mrId: mr.MR_ID }).then(function (res) {
        refresh('SO ' + res.soNumber + ' berhasil dibuat.');
      }).catch(function (err) { Api.handle(err, 'Gagal membuat SO'); });
      return;
    }

    if (action === 'schedule') {
      Modal.confirm({
        title: 'Jadwal penarikan',
        sub: mr.MR_ID,
        body: '<div class="field-row">'
          + '<div class="field"><label class="field__label">Tanggal penarikan</label>'
          + '<input class="input" type="date" id="pickup-date" value="' + (mr.PICKUP_DATE || '') + '"></div>'
          + '<div class="field"><label class="field__label">PIC</label>'
          + '<input class="input" id="pickup-pic" value="' + UI.escapeHtml(mr.PIC || '') + '"></div></div>',
        confirmLabel: 'Simpan jadwal',
        validate: function (body) {
          var date = qs('#pickup-date', body).value;
          if (!date) { Toast.warning('Tanggal wajib diisi'); return false; }
          return { date: date, pic: qs('#pickup-pic', body).value };
        }
      }).then(function (result) {
        if (!result) return;
        Api.call('mr.schedule', { mrId: mr.MR_ID, pickupDate: result.date, pic: result.pic })
          .then(function () { refresh('Jadwal penarikan tersimpan.'); })
          .catch(function (err) { Api.handle(err, 'Gagal menyimpan jadwal'); });
      });
      return;
    }

    if (action === 'complete') {
      Modal.confirm({
        title: 'Tandai MR selesai',
        sub: mr.MR_ID,
        body: UI.alert('info', 'Realisasi return dicatat',
          'Dokumen yang selesai otomatis tercatat pada data return sehingga MR% ikut ter-update.'),
        confirmLabel: 'Tandai selesai', tone: 'success'
      }).then(function (confirmed) {
        if (!confirmed) return;
        Api.call('mr.complete', { mrId: mr.MR_ID }).then(function () {
          refresh('Dokumen ditandai selesai.');
        }).catch(function (err) { Api.handle(err, 'Gagal menyelesaikan dokumen'); });
      });
    }
  },

  exportCsv: function (ctx) {
    Api.call('analytics.export', { type: 'MR', filters: ctx.filters() }).then(function (data) {
      downloadCsv(data.filename, data.csv);
      Toast.success('Export selesai', data.rowCount + ' baris diunduh.');
    }).catch(function (err) { Api.handle(err, 'Export gagal'); });
  }
};
</script>
