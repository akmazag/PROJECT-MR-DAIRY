<!-- =========================================================================
     SOP.html — SOP Market Return
     Plotting Jadwal Penarikan · Komitmen Cutoff · Ketentuan BAP
     ========================================================================= -->
<section class="page" id="page-sop">

  <div class="page-head">
    <div>
      <h1 class="page-title">SOP Market Return</h1>
      <p class="page-head__sub">
        Aturan operasional yang menjadi dasar seluruh proses administrasi MR
      </p>
    </div>
    <div class="page-actions">
      <button class="btn btn--secondary btn--sm" data-sop="rules" hidden>Ubah aturan</button>
    </div>
  </div>

  <div class="tabs" data-sop-tabs>
    <button class="tab is-active" data-tab="workflow">Alur SOP</button>
    <button class="tab" data-tab="pickup">Jadwal Penarikan</button>
    <button class="tab" data-tab="cutoff">Komitmen Cutoff</button>
    <button class="tab" data-tab="bap">Ketentuan BAP</button>
  </div>

  <div data-tab-panel="workflow">
    <div data-sop-steps class="stack"></div>
  </div>

  <div data-tab-panel="pickup" hidden>
    <div data-filter-slot></div>
    <div class="grid grid--kpi" data-pickup-kpi style="margin-bottom:16px"></div>
    <div class="grid grid--2-1">
      <div class="card">
        <div class="card__head">
          <div><div class="card-title">Timeline penarikan</div>
            <div class="caption">Dikelompokkan per tanggal pickup</div></div>
        </div>
        <div class="card__body"><div data-pickup-timeline></div></div>
      </div>
      <div class="card">
        <div class="card__head">
          <div><div class="card-title">Belum dijadwalkan</div>
            <div class="caption">Wajib dijadwalkan sebelum SO dibuat</div></div>
        </div>
        <div class="card__body card__body--flush"><div data-pickup-unscheduled></div></div>
      </div>
    </div>
  </div>

  <div data-tab-panel="cutoff" hidden>
    <div class="grid grid--kpi" data-cutoff-kpi style="margin-bottom:16px"></div>
    <div class="card">
      <div class="card__head">
        <div><div class="card-title">Komitmen potong tagihan</div>
          <div class="caption" data-cutoff-note>—</div></div>
      </div>
      <div class="card__body card__body--flush"><div data-cutoff-table></div></div>
      <div data-cutoff-pagination></div>
    </div>
  </div>

  <div data-tab-panel="bap" hidden>
    <div class="grid grid--1-2" style="margin-bottom:16px">
      <div class="card">
        <div class="card__head"><div class="card-title">Aturan aktif</div></div>
        <div class="card__body"><div data-bap-rule></div></div>
      </div>
      <div class="card">
        <div class="card__head"><div class="card-title">Dampak pada dokumen berjalan</div></div>
        <div class="card__body"><div data-bap-summary></div></div>
      </div>
    </div>
    <div class="card">
      <div class="card__head"><div class="card-title">Dokumen yang wajib BAP</div></div>
      <div class="card__body card__body--flush"><div data-bap-table></div></div>
    </div>
  </div>
</section>

<script>
definePage('sop', {
  title: 'SOP MR',
  breadcrumb: ['MR Dairy', 'SOP'],
  permission: 'sop.view',
  filters: ['region', 'account', 'search'],

  mount: function (ctx) {
    ctx.root.__state = { tab: 'workflow', cutoffPage: 1 };
    ctx.all('[data-sop-tabs] .tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        var name = tab.getAttribute('data-tab');
        ctx.root.__state.tab = name;
        ctx.all('[data-sop-tabs] .tab').forEach(function (t) { t.classList.toggle('is-active', t === tab); });
        ctx.all('[data-tab-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-tab-panel') !== name; });
        SOP.loadTab(ctx);
      });
    });
    ctx.root.addEventListener('click', function (event) {
      var btn = event.target.closest('[data-sop]');
      if (btn && btn.getAttribute('data-sop') === 'rules') SOP.openRules(ctx);
    });
  },

  load: function (ctx) {
    var editBtn = ctx.el('[data-sop="rules"]');
    if (editBtn) editBtn.hidden = !App.can('sop.edit');
    if (ctx.params && ctx.params.tab) {
      var tab = ctx.params.tab;
      ctx.params.tab = null;
      var target = ctx.el('[data-sop-tabs] .tab[data-tab="' + tab + '"]');
      if (target) { target.click(); return; }
    }
    SOP.loadTab(ctx);
  }
});

var SOP = {
  loadTab: function (ctx) {
    var tab = ctx.root.__state.tab;
    if (tab === 'workflow') SOP.loadWorkflow(ctx);
    if (tab === 'pickup') SOP.loadPickup(ctx);
    if (tab === 'cutoff') SOP.loadCutoff(ctx);
    if (tab === 'bap') SOP.loadBap(ctx);
  },

  /* ---- Alur SOP ---- */
  loadWorkflow: function (ctx) {
    ctx.el('[data-sop-steps]').innerHTML = UI.skeletonTable(3, 2);
    Api.call('sop.workflow', {}).then(function (data) {
      ctx.root.__sop = data;
      paint(function () {
        ctx.el('[data-sop-steps]').innerHTML = data.steps.map(function (step, idx) {
          var m = step.metrics;
          return '<div class="card"><div class="card__body">'
            + '<div class="row row--between" style="align-items:flex-start;gap:16px">'
            + '<div class="row" style="gap:14px;align-items:flex-start;min-width:0">'
            + '<div class="tracker__dot" style="width:32px;height:32px;font-size:13px;border-color:var(--petrol-500);'
            + 'color:var(--petrol-600)">' + (idx + 1) + '</div>'
            + '<div style="min-width:0"><div class="row" style="gap:8px"><span class="section-title">'
            + UI.escapeHtml(step.TITLE) + '</span>' + UI.statusBadge(step.STATUS) + '</div>'
            + '<p class="caption" style="margin-top:4px;max-width:640px">' + UI.escapeHtml(step.DESCRIPTION) + '</p>'
            + '<div class="panel" style="margin-top:12px;background:var(--surface-3)">'
            + '<div class="overline" style="margin-bottom:4px">Aturan</div>'
            + '<div style="font-size:12.5px;line-height:1.6">' + UI.escapeHtml(step.RULE) + '</div></div>'
            + '<div class="stat-strip" style="margin-top:14px">'
            + '<div class="stat-strip__item"><div class="stat-strip__label">PIC</div>'
            + '<div class="meta-item__value">' + UI.escapeHtml(step.PIC) + '</div></div>'
            + '<div class="stat-strip__item"><div class="stat-strip__label">SLA</div>'
            + '<div class="meta-item__value">' + step.SLA_DAYS + ' hari</div></div>'
            + '<div class="stat-strip__item"><div class="stat-strip__label">Kepatuhan</div>'
            + '<div class="meta-item__value">' + UI.fmt.decimal(step.compliance, 1) + '%</div></div>'
            + '<div class="stat-strip__item"><div class="stat-strip__label">' + UI.escapeHtml(m.issueLabel || 'Perlu tindakan') + '</div>'
            + '<div class="meta-item__value ' + (m.issue ? 'text-danger' : 'text-success') + '">'
            + UI.fmt.number(m.issue) + ' dari ' + UI.fmt.number(m.total) + '</div></div>'
            + '</div></div></div>'
            + (App.can('sop.edit') ? '<button class="btn btn--secondary btn--sm" data-sop-edit="'
              + UI.escapeHtml(step.SOP_ID) + '">' + UI.icon('edit', 13) + ' Ubah</button>' : '')
            + '</div>'
            + '<div style="margin-top:14px">' + UI.miniBar(step.compliance,
              step.compliance >= 90 ? 'success' : (step.compliance >= 70 ? 'warning' : 'danger')) + '</div>'
            + '</div></div>';
        }).join('');

        ctx.all('[data-sop-edit]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var step = data.steps.filter(function (s) { return s.SOP_ID === btn.getAttribute('data-sop-edit'); })[0];
            SOP.openEdit(ctx, step);
          });
        });
      });
    }).catch(function (err) {
      Api.handle(err, 'Gagal memuat SOP');
      ctx.el('[data-sop-steps]').innerHTML = UI.alert('danger', 'Data tidak dapat dimuat', err.message || '');
    });
  },

  openEdit: function (ctx, step) {
    Modal.open({
      large: true,
      title: 'Ubah SOP',
      sub: step.CODE,
      body: '<div class="stack">'
        + '<div class="field"><label class="field__label">Judul</label>'
        + '<input class="input" id="sop-title" value="' + UI.escapeHtml(step.TITLE) + '"></div>'
        + '<div class="field"><label class="field__label">Deskripsi</label>'
        + '<textarea class="textarea" id="sop-desc">' + UI.escapeHtml(step.DESCRIPTION) + '</textarea></div>'
        + '<div class="field"><label class="field__label">Aturan</label>'
        + '<textarea class="textarea" id="sop-rule">' + UI.escapeHtml(step.RULE) + '</textarea></div>'
        + '<div class="field-row">'
        + '<div class="field"><label class="field__label">PIC</label>'
        + '<input class="input" id="sop-pic" value="' + UI.escapeHtml(step.PIC) + '"></div>'
        + '<div class="field"><label class="field__label">SLA (hari)</label>'
        + '<input class="input" type="number" min="0" id="sop-sla" value="' + step.SLA_DAYS + '"></div>'
        + '<div class="field"><label class="field__label">Status</label>'
        + '<select class="select" id="sop-status">'
        + ['ACTIVE', 'DRAFT', 'INACTIVE'].map(function (s) {
          return '<option value="' + s + '"' + (step.STATUS === s ? ' selected' : '') + '>' + s + '</option>';
        }).join('') + '</select></div></div></div>',
      actions: [
        { label: 'Batal', tone: 'secondary' },
        {
          label: 'Simpan', tone: 'primary', close: false,
          onClick: function (body) {
            Api.call('sop.updateSop', {
              sopId: step.SOP_ID,
              TITLE: qs('#sop-title', body).value,
              DESCRIPTION: qs('#sop-desc', body).value,
              RULE: qs('#sop-rule', body).value,
              PIC: qs('#sop-pic', body).value,
              SLA_DAYS: qs('#sop-sla', body).value,
              STATUS: qs('#sop-status', body).value
            }).then(function () {
              Modal.close();
              Toast.success('SOP diperbarui');
              SOP.loadWorkflow(ctx);
            }).catch(function (err) { Api.handle(err, 'Gagal menyimpan SOP'); });
            return false;
          }
        }
      ]
    });
  },

  openRules: function (ctx) {
    var data = ctx.root.__sop;
    if (!data) return;
    var keys = Object.keys(data.rules);
    Modal.open({
      large: true,
      title: 'Aturan SOP',
      sub: 'Perubahan langsung berlaku pada seluruh proses MR',
      body: '<div class="stack">' + keys.map(function (key) {
        var value = data.rules[key];
        var isBap = key === 'BAP_RULE';
        var isBool = ['TRUE', 'FALSE'].indexOf(String(value).toUpperCase()) !== -1;
        var control;
        if (isBap) {
          control = '<select class="select" data-rule="' + key + '">'
            + ['FRESH_EXEMPT', 'ALWAYS', 'NEVER'].map(function (v) {
              return '<option value="' + v + '"' + (value === v ? ' selected' : '') + '>' + v.replace(/_/g, ' ') + '</option>';
            }).join('') + '</select>';
        } else if (isBool) {
          control = '<select class="select" data-rule="' + key + '">'
            + ['TRUE', 'FALSE'].map(function (v) {
              return '<option value="' + v + '"' + (String(value).toUpperCase() === v ? ' selected' : '') + '>' + v + '</option>';
            }).join('') + '</select>';
        } else {
          control = '<input class="input" data-rule="' + key + '" value="' + UI.escapeHtml(value) + '">';
        }
        return '<div class="field"><label class="field__label">' + key + '</label>' + control
          + '<span class="field__hint">' + UI.escapeHtml(data.ruleDescriptions[key] || '') + '</span></div>';
      }).join('') + '</div>',
      actions: [
        { label: 'Tutup', tone: 'secondary' },
        {
          label: 'Simpan aturan', tone: 'primary', close: false,
          onClick: function (body) {
            var changes = qsa('[data-rule]', body).filter(function (input) {
              return String(input.value) !== String(data.rules[input.getAttribute('data-rule')]);
            });
            if (!changes.length) { Toast.info('Tidak ada perubahan'); return false; }
            var queue = changes.map(function (input) {
              return Api.call('sop.updateRule', { key: input.getAttribute('data-rule'), value: input.value });
            });
            Promise.all(queue).then(function () {
              Modal.close();
              Toast.success('Aturan diperbarui', changes.length + ' konfigurasi disimpan.');
              SOP.loadWorkflow(ctx);
            }).catch(function (err) { Api.handle(err, 'Gagal menyimpan aturan'); });
            return false;
          }
        }
      ]
    });
  },

  /* ---- Jadwal penarikan ---- */
  loadPickup: function (ctx) {
    ctx.el('[data-pickup-timeline]').innerHTML = UI.skeletonTable(4, 2);
    ctx.el('[data-pickup-unscheduled]').innerHTML = UI.skeletonTable(3, 2);
    Api.call('sop.pickup', { filters: ctx.filters() }).then(function (data) {
      paint(function () {
        var s = data.summary;
        ctx.el('[data-pickup-kpi]').innerHTML = [
          UI.kpiCard({ label: 'Terjadwal', valueHtml: UI.fmt.number(s.scheduled), unit: 'dok', iconName: 'calendar' }),
          UI.kpiCard({ label: 'Belum dijadwalkan', valueHtml: UI.fmt.number(s.unscheduled), unit: 'dok', iconName: 'alert', accent: true }),
          UI.kpiCard({ label: 'Lewat jadwal', valueHtml: UI.fmt.number(s.overdue), unit: 'dok', iconName: 'clock' }),
          UI.kpiCard({ label: 'SLA Penarikan', valueHtml: UI.fmt.number(s.slaDays), unit: 'hari', iconName: 'truck' })
        ].join('');

        ctx.el('[data-pickup-timeline]').innerHTML = data.timeline.length
          ? data.timeline.map(function (day) {
            return '<div style="margin-bottom:18px">'
              + '<div class="row row--between" style="margin-bottom:8px">'
              + '<div class="row" style="gap:8px">'
              + '<span class="card-title">' + UI.escapeHtml(day.dayLabel) + '</span>'
              + (day.isToday ? UI.badge('HARI INI', 'info') : (day.isPast ? UI.badge('LEWAT', 'danger') : ''))
              + '</div>'
              + '<span class="caption">' + day.count + ' dokumen · ' + UI.fmt.number(day.qty) + ' qty</span></div>'
              + day.items.map(function (item) {
                return '<div class="check-item" style="cursor:pointer" data-pickup-mr="' + UI.escapeHtml(item.MR_ID) + '">'
                  + '<span class="check-item__icon check-item__icon--'
                  + (item.sla && item.sla.label === 'OVERDUE' ? 'error' : 'pass') + '">'
                  + UI.icon('truck', 11) + '</span>'
                  + '<div style="flex:1;min-width:0"><div class="row row--between">'
                  + '<span class="check-item__label">' + UI.escapeHtml(item.accountName) + '</span>'
                  + UI.statusBadge(item.MR_STATUS) + '</div>'
                  + '<div class="check-item__msg">' + UI.escapeHtml(item.skuName) + ' · '
                  + UI.fmt.number(item.RETURN_QTY) + ' qty · PIC ' + UI.escapeHtml(item.PIC || '-') + '</div></div></div>';
              }).join('') + '</div>';
          }).join('')
          : UI.emptyState({
            icon: 'calendar', title: 'Belum ada jadwal penarikan',
            desc: 'Tetapkan jadwal penarikan pada dokumen MR agar SO dapat diproses.'
          });

        ctx.el('[data-pickup-unscheduled]').innerHTML = data.unscheduled.length
          ? UI.table({
            compact: true,
            columns: [
              {
                key: 'accountName', label: 'Account', render: function (r) {
                  return '<span class="t-strong">' + UI.escapeHtml(r.accountName) + '</span>'
                    + '<span class="table__cell-sub">' + UI.escapeHtml(r.skuName) + '</span>';
                }
              },
              { key: 'MR_DATE', label: 'Tgl MR', render: function (r) { return UI.fmt.date(r.MR_DATE); } },
              {
                key: 'suggestedDate', label: 'Usulan', render: function (r) {
                  return '<span class="text-muted">' + UI.fmt.date(r.suggestedDate) + '</span>';
                }
              }
            ],
            rows: data.unscheduled,
            rowAttrs: function (row) {
              return 'style="cursor:pointer" data-pickup-mr="' + UI.escapeHtml(row.MR_ID) + '"';
            }
          })
          : UI.emptyState({ icon: 'check', title: 'Semua terjadwal', desc: 'Tidak ada dokumen tanpa jadwal penarikan.' });

        ctx.all('[data-pickup-mr]').forEach(function (el) {
          el.addEventListener('click', function () {
            App.navigate('mr', { mrId: el.getAttribute('data-pickup-mr') });
          });
        });
      });
    }).catch(function (err) { Api.handle(err, 'Gagal memuat jadwal penarikan'); });
  },

  /* ---- Cutoff ---- */
  loadCutoff: function (ctx) {
    ctx.el('[data-cutoff-table]').innerHTML = UI.skeletonTable(6, 5);
    Api.call('sop.cutoff', { filters: ctx.filters(), page: ctx.root.__state.cutoffPage, pageSize: 25 })
      .then(function (data) {
        paint(function () {
          var s = data.summary;
          ctx.el('[data-cutoff-kpi]').innerHTML = [
            UI.kpiCard({ label: 'Cutoff', valueHtml: UI.fmt.number(s.cutoffDays), unit: 'hari', iconName: 'calendar',
              sub: 'dihitung dari tanggal MR' }),
            UI.kpiCard({ label: 'On Track', valueHtml: UI.fmt.number(s.onTrack), unit: 'dok', iconName: 'check' }),
            UI.kpiCard({ label: 'Mendekati Cutoff', valueHtml: UI.fmt.number(s.dueSoon), unit: 'dok', iconName: 'clock', accent: true }),
            UI.kpiCard({ label: 'Terlewat', valueHtml: UI.fmt.number(s.overdue), unit: 'dok', iconName: 'alert',
              sub: UI.fmt.compactCurrency(s.valueAtRisk) + ' nilai tertahan' })
          ].join('');
          ctx.el('[data-cutoff-note]').textContent = 'Cutoff = tanggal MR + ' + s.cutoffDays
            + ' hari (dapat diubah pada aturan SOP)';

          ctx.el('[data-cutoff-table]').innerHTML = data.rows.length ? UI.table({
            compact: true,
            columns: [
              { key: 'MR_ID', label: 'MR', render: function (r) { return '<span class="mono">' + UI.escapeHtml(r.MR_ID) + '</span>'; } },
              {
                key: 'accountName', label: 'Account / SKU', render: function (r) {
                  return '<span class="t-strong">' + UI.escapeHtml(r.accountName) + '</span>'
                    + '<span class="table__cell-sub">' + UI.escapeHtml(r.skuName) + '</span>';
                }
              },
              { key: 'RETURN_VALUE', label: 'Nilai', align: 'right', render: function (r) { return UI.fmt.compactCurrency(r.RETURN_VALUE); } },
              { key: 'CUTOFF_DATE', label: 'Cutoff', render: function (r) { return UI.fmt.date(r.CUTOFF_DATE); } },
              {
                key: 'daysRemaining', label: 'Sisa hari', align: 'right', render: function (r) {
                  if (r.daysRemaining === null) return '—';
                  var tone = r.daysRemaining < 0 ? 'text-danger' : (r.daysRemaining <= 2 ? 'text-warning' : '');
                  return '<span class="' + tone + '" style="font-weight:650">' + r.daysRemaining + '</span>';
                }
              },
              { key: 'commitmentStatus', label: 'Komitmen', align: 'center', render: function (r) { return UI.statusBadge(r.commitmentStatus); } },
              { key: 'MR_STATUS', label: 'Status MR', align: 'center', render: function (r) { return UI.statusBadge(r.MR_STATUS); } }
            ],
            rows: data.rows,
            rowAttrs: function (row) { return 'style="cursor:pointer" data-cutoff-mr="' + UI.escapeHtml(row.MR_ID) + '"'; }
          }) : UI.emptyState({
            icon: 'check', title: 'Tidak ada komitmen berjalan',
            desc: 'Seluruh dokumen MR sudah diselesaikan atau belum ada dokumen aktif.'
          });
          ctx.el('[data-cutoff-pagination]').innerHTML = UI.pagination(data.meta);

          ctx.all('[data-cutoff-mr]').forEach(function (tr) {
            tr.addEventListener('click', function () { App.navigate('mr', { mrId: tr.getAttribute('data-cutoff-mr') }); });
          });
          ctx.all('[data-cutoff-pagination] .page-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
              if (btn.disabled) return;
              ctx.root.__state.cutoffPage = Number(btn.getAttribute('data-page'));
              SOP.loadCutoff(ctx);
            });
          });
        });
      }).catch(function (err) { Api.handle(err, 'Gagal memuat komitmen cutoff'); });
  },

  /* ---- BAP ---- */
  loadBap: function (ctx) {
    ctx.el('[data-bap-table]').innerHTML = UI.skeletonTable(5, 4);
    Api.call('sop.bap', { filters: ctx.filters() }).then(function (data) {
      paint(function () {
        var active = data.ruleOptions.filter(function (o) { return o.value === data.rule; })[0] || data.ruleOptions[0];
        ctx.el('[data-bap-rule]').innerHTML = [
          '<div class="stack">',
          '<div><div class="overline">Mode aturan</div>',
          '<div class="row" style="gap:8px;margin-top:6px">' + UI.badge(active.label, 'info')
          + '<span class="caption">' + UI.escapeHtml(active.description) + '</span></div></div>',
          '<div class="meta-grid">',
          UI.metaItem('Batas fresh', data.freshMinRemainingDays + ' hari sisa umur'),
          UI.metaItem('Batas nilai', UI.fmt.compactCurrency(data.valueThreshold)),
          '</div>',
          UI.alert('info', 'Bagaimana aturan dibaca sistem',
            'Pada mode Fresh Exempt, dokumen dengan sisa umur produk minimal '
            + data.freshMinRemainingDays + ' hari dan nilai return maksimal '
            + UI.fmt.compactCurrency(data.valueThreshold) + ' tidak wajib BAP.'),
          App.can('sop.edit') ? '<button class="btn btn--secondary btn--sm" data-sop="rules">Ubah aturan BAP</button>' : '',
          '</div>'
        ].join('');

        var s = data.summary;
        ctx.el('[data-bap-summary]').innerHTML = '<div class="grid grid--2" style="gap:12px">'
          + UI.kpiCard({ label: 'Wajib BAP', valueHtml: UI.fmt.number(s.required), unit: 'dok' })
          + UI.kpiCard({ label: 'Dikecualikan', valueHtml: UI.fmt.number(s.exempt), unit: 'dok' })
          + UI.kpiCard({ label: 'BAP diterima', valueHtml: UI.fmt.number(s.received), unit: 'dok' })
          + UI.kpiCard({ label: 'BAP pending', valueHtml: UI.fmt.number(s.pending), unit: 'dok', accent: true })
          + '</div>';

        ctx.el('[data-bap-table]').innerHTML = data.rows.length ? UI.table({
          compact: true,
          columns: [
            { key: 'MR_ID', label: 'MR', render: function (r) { return '<span class="mono">' + UI.escapeHtml(r.MR_ID) + '</span>'; } },
            {
              key: 'accountName', label: 'Account / SKU', render: function (r) {
                return '<span class="t-strong">' + UI.escapeHtml(r.accountName) + '</span>'
                  + '<span class="table__cell-sub">' + UI.escapeHtml(r.skuName) + '</span>';
              }
            },
            { key: 'RETURN_VALUE', label: 'Nilai', align: 'right', render: function (r) { return UI.fmt.compactCurrency(r.RETURN_VALUE); } },
            { key: 'EXPIRY_DATE', label: 'Expiry', render: function (r) { return UI.fmt.date(r.EXPIRY_DATE); } },
            { key: 'BAP_STATUS', label: 'BAP', align: 'center', render: function (r) { return UI.statusBadge(r.BAP_STATUS); } },
            { key: 'MR_STATUS', label: 'Status', align: 'center', render: function (r) { return UI.statusBadge(r.MR_STATUS); } }
          ],
          rows: data.rows,
          rowAttrs: function (row) { return 'style="cursor:pointer" data-bap-mr="' + UI.escapeHtml(row.MR_ID) + '"'; }
        }) : UI.emptyState({
          icon: 'check', title: 'Tidak ada dokumen wajib BAP',
          desc: 'Seluruh dokumen MR berjalan termasuk kategori yang dikecualikan.'
        });

        ctx.all('[data-bap-mr]').forEach(function (tr) {
          tr.addEventListener('click', function () { App.navigate('mr', { mrId: tr.getAttribute('data-bap-mr') }); });
        });
      });
    }).catch(function (err) { Api.handle(err, 'Gagal memuat ketentuan BAP'); });
  }
};
</script>
