<script>
/* =========================================================================
   UI — helper render (string HTML) + formatter
   ========================================================================= */
var UI = (function () {

  var TONE_BY_STATUS = {
    // MR workflow
    INPUT: 'muted', VALIDATED: 'info', WAITING_APPROVAL: 'warning', APPROVED: 'success',
    SO_CREATED: 'purple', PICKUP_SCHEDULED: 'info', COMPLETED: 'success', REJECTED: 'danger',
    // Allocation plan
    DRAFT: 'muted', SUBMITTED: 'info', NOT_PLANNED: 'muted',
    // Risk & potential
    HIGH: 'danger', MEDIUM: 'warning', LOW: 'success',
    // Validation
    PASS: 'success', WARNING: 'warning', ERROR: 'danger', NOT_VALIDATED: 'muted',
    // SLA & komitmen
    ON_TIME: 'success', ON_TRACK: 'success', DUE_SOON: 'warning', OVERDUE: 'danger',
    FULFILLED: 'success', NO_CUTOFF: 'muted',
    // Umum
    ACTIVE: 'success', INACTIVE: 'muted', PENDING: 'warning', RECEIVED: 'success',
    NOT_REQUIRED: 'muted', CREATED: 'success', NOT_CREATED: 'muted', CANCELLED: 'muted',
    PROCESSED: 'success', OPEN: 'info'
  };

  var POTENTIAL_TONE = { HIGH: 'success', MEDIUM: 'info', LOW: 'muted' };

  function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function icon(name, size, cls) {
    var s = size || 16;
    return '<svg class="' + (cls || '') + '" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" '
      + 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" '
      + 'stroke-linejoin="round" aria-hidden="true"><use href="#i-' + name + '"></use></svg>';
  }

  // ---- Formatter ---------------------------------------------------------
  var fmt = {
    number: function (value, decimals) {
      var n = Number(value);
      if (!isFinite(n)) return '—';
      return n.toLocaleString('id-ID', {
        minimumFractionDigits: decimals || 0, maximumFractionDigits: decimals === undefined ? 0 : decimals
      });
    },
    decimal: function (value, decimals) {
      var n = Number(value);
      if (!isFinite(n)) return '—';
      var d = decimals === undefined ? 1 : decimals;
      return n.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d });
    },
    percent: function (value, decimals) {
      var n = Number(value);
      if (!isFinite(n)) return '—';
      var d = decimals === undefined ? 2 : decimals;
      return n.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
    },
    currency: function (value) {
      var n = Number(value) || 0;
      return (window.App && App.state.app.currencySymbol ? App.state.app.currencySymbol : 'Rp')
        + ' ' + n.toLocaleString('id-ID', { maximumFractionDigits: 0 });
    },
    compact: function (value) {
      var n = Number(value) || 0;
      var abs = Math.abs(n);
      if (abs >= 1e12) return (n / 1e12).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' T';
      if (abs >= 1e9) return (n / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' M';
      if (abs >= 1e6) return (n / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt';
      if (abs >= 1e3) return (n / 1e3).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' rb';
      return n.toLocaleString('id-ID', { maximumFractionDigits: 0 });
    },
    compactCurrency: function (value) {
      var symbol = (window.App && App.state.app.currencySymbol) ? App.state.app.currencySymbol : 'Rp';
      return symbol + ' ' + fmt.compact(value);
    },
    date: function (value) {
      if (!value) return '—';
      var parts = String(value).substring(0, 10).split('-');
      if (parts.length !== 3) return escapeHtml(value);
      var months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      return parts[2] + ' ' + (months[Number(parts[1]) - 1] || parts[1]) + ' ' + parts[0];
    },
    dateTime: function (value) {
      if (!value) return '—';
      var str = String(value);
      return fmt.date(str.substring(0, 10)) + (str.length > 10 ? ' · ' + str.substring(11, 16) : '');
    },
    relative: function (value) {
      if (!value) return '—';
      var then = new Date(String(value).replace(' ', 'T'));
      if (isNaN(then.getTime())) return fmt.dateTime(value);
      var diff = (Date.now() - then.getTime()) / 1000;
      if (diff < 60) return 'baru saja';
      if (diff < 3600) return Math.floor(diff / 60) + ' menit lalu';
      if (diff < 86400) return Math.floor(diff / 3600) + ' jam lalu';
      if (diff < 604800) return Math.floor(diff / 86400) + ' hari lalu';
      return fmt.date(value);
    },
    qty: function (value, unit) {
      return fmt.number(value) + (unit ? ' <span class="text-muted" style="font-weight:400">' + escapeHtml(unit) + '</span>' : '');
    },
    label: function (value) {
      return escapeHtml(String(value || '').replace(/_/g, ' '));
    }
  };

  // ---- Atoms -------------------------------------------------------------
  function badge(text, tone, plain) {
    return '<span class="badge badge--' + (tone || 'muted') + (plain ? ' badge--plain' : '') + '">'
      + escapeHtml(text) + '</span>';
  }

  function statusBadge(status, options) {
    var key = String(status || '').toUpperCase();
    var opts = options || {};
    var tone = opts.tone || (opts.potential ? POTENTIAL_TONE[key] : TONE_BY_STATUS[key]) || 'muted';
    return badge(opts.label || key.replace(/_/g, ' '), tone, opts.plain);
  }

  function riskBadge(level, score) {
    var tone = TONE_BY_STATUS[String(level || '').toUpperCase()] || 'muted';
    return '<span class="badge badge--' + tone + '" title="Risk score ' + (score || 0) + '/100">'
      + escapeHtml(String(level || '').replace(/_/g, ' ')) + '</span>';
  }

  function delta(config) {
    var d = config.delta;
    if (d === null || d === undefined) {
      return '<span class="delta delta--flat">—</span>';
    }
    var good = config.good;
    var cls = good === null || good === undefined ? 'flat' : (good ? 'good' : 'bad');
    var arrow = d > 0 ? 'arrow-up' : (d < 0 ? 'arrow-down' : 'check');
    return '<span class="delta delta--' + cls + '">' + icon(arrow, 11)
      + Math.abs(Number(d)).toLocaleString('id-ID', { maximumFractionDigits: 2 })
      + (config.suffix || '%') + '</span>';
  }

  /**
   * KPI card.
   * config: {label, value, unit, sub, delta, good, iconName, accent, onClick, format}
   */
  function kpiCard(config) {
    var valueHtml = config.valueHtml || escapeHtml(config.value);
    var parts = [];
    parts.push('<div class="kpi' + (config.accent ? ' kpi--accent' : '')
      + (config.action ? ' kpi--clickable' : '') + '"'
      + (config.action ? ' data-kpi-action="' + escapeHtml(config.action) + '" role="button" tabindex="0"' : '') + '>');
    parts.push('<div class="kpi__top"><span class="kpi__label">' + escapeHtml(config.label) + '</span>');
    if (config.iconName) parts.push('<span class="kpi__icon">' + icon(config.iconName, 15) + '</span>');
    parts.push('</div>');
    parts.push('<div class="kpi__value num">' + valueHtml
      + (config.unit ? '<small>' + escapeHtml(config.unit) + '</small>' : '') + '</div>');
    parts.push('<div class="kpi__foot">');
    if (config.delta !== undefined && config.delta !== null) parts.push(delta(config));
    if (config.sub) parts.push('<span class="kpi__sub">' + config.sub + '</span>');
    parts.push('</div></div>');
    return parts.join('');
  }

  function emptyState(config) {
    var c = config || {};
    return '<div class="empty">'
      + '<div class="empty__icon">' + icon(c.icon || 'inbox', 22) + '</div>'
      + '<div class="empty__title">' + escapeHtml(c.title || 'Belum ada data') + '</div>'
      + '<div class="empty__desc">' + escapeHtml(c.desc || '') + '</div>'
      + (c.actionLabel ? '<button class="btn btn--primary btn--sm" data-empty-action="'
        + escapeHtml(c.action || '') + '">' + escapeHtml(c.actionLabel) + '</button>' : '')
      + '</div>';
  }

  function alert(tone, title, message) {
    var iconName = tone === 'success' ? 'check' : (tone === 'danger' ? 'alert' : (tone === 'warning' ? 'alert' : 'info'));
    return '<div class="alert alert--' + tone + '">' + icon(iconName, 15)
      + '<div>' + (title ? '<div class="alert__title">' + escapeHtml(title) + '</div>' : '')
      + escapeHtml(message) + '</div></div>';
  }

  // ---- Skeleton ----------------------------------------------------------
  function skeletonKpi(count) {
    var out = [];
    for (var i = 0; i < (count || 4); i++) {
      out.push('<div class="sk-kpi"><div class="sk sk--text" style="width:45%"></div>'
        + '<div class="sk sk--value" style="margin-top:14px"></div>'
        + '<div class="sk sk--text" style="width:60%;margin-top:12px"></div></div>');
    }
    return out.join('');
  }

  function skeletonTable(rows, cols) {
    var out = [];
    for (var r = 0; r < (rows || 6); r++) {
      var cells = [];
      for (var c = 0; c < (cols || 5); c++) {
        cells.push('<div><div class="sk sk--line" style="width:' + (c === 0 ? 70 : 45 + (c * 7) % 40) + '%"></div></div>');
      }
      out.push('<div class="sk-row">' + cells.join('') + '</div>');
    }
    return out.join('');
  }

  function skeletonChart(height) {
    return '<div class="sk sk--chart" style="height:' + (height || 210) + 'px"></div>';
  }

  // ---- Table -------------------------------------------------------------
  /**
   * columns: [{key, label, align, width, sortable, render(row), className}]
   */
  function table(config) {
    var cols = config.columns || [];
    var rows = config.rows || [];
    var head = cols.map(function (col) {
      var align = col.align === 'right' ? ' style="text-align:right"' : (col.align === 'center' ? ' style="text-align:center"' : '');
      var sortable = col.sortable ? ' class="is-sortable" data-sort-key="' + escapeHtml(col.sortKey || col.key) + '"' : '';
      var indicator = '';
      if (col.sortable && config.sortKey === (col.sortKey || col.key)) {
        indicator = '<span class="sort-ind">' + (config.sortDir === 'asc' ? '&uarr;' : '&darr;') + '</span>';
      }
      return '<th' + sortable + align + '>' + escapeHtml(col.label) + indicator + '</th>';
    }).join('');

    var body = rows.map(function (row, index) {
      var cells = cols.map(function (col) {
        var align = col.align === 'right' ? ' t-right' : (col.align === 'center' ? ' t-center' : '');
        var content = col.render ? col.render(row, index) : escapeHtml(row[col.key]);
        return '<td class="' + (col.className || '') + align + '">' + content + '</td>';
      }).join('');
      var attrs = config.rowAttrs ? config.rowAttrs(row, index) : '';
      return '<tr ' + attrs + '>' + cells + '</tr>';
    }).join('');

    return '<div class="table-wrap"><table class="table' + (config.compact ? ' table--compact' : '') + '">'
      + '<thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }

  function pagination(meta, options) {
    if (!meta) return '';
    var opts = options || {};
    var pages = [];
    var total = meta.totalPages || 1;
    var current = meta.page || 1;
    var start = Math.max(1, current - 2);
    var end = Math.min(total, start + 4);
    start = Math.max(1, end - 4);

    pages.push('<button class="page-btn" data-page="' + (current - 1) + '"'
      + (current <= 1 ? ' disabled' : '') + ' aria-label="Sebelumnya">' + icon('chevron-left', 13) + '</button>');
    for (var p = start; p <= end; p++) {
      pages.push('<button class="page-btn' + (p === current ? ' is-active' : '') + '" data-page="' + p + '">' + p + '</button>');
    }
    pages.push('<button class="page-btn" data-page="' + (current + 1) + '"'
      + (current >= total ? ' disabled' : '') + ' aria-label="Berikutnya">' + icon('chevron-right', 13) + '</button>');

    return '<div class="pagination"><div class="pagination__info">Menampilkan '
      + fmt.number(meta.from) + '–' + fmt.number(meta.to) + ' dari ' + fmt.number(meta.total) + ' baris'
      + (opts.label ? ' ' + escapeHtml(opts.label) : '') + '</div>'
      + '<div class="pagination__controls">' + pages.join('') + '</div></div>';
  }

  function progressTracker(steps, currentIndex) {
    return '<div class="tracker">' + steps.map(function (step, idx) {
      var cls = idx < currentIndex ? 'is-done' : (idx === currentIndex ? 'is-current' : '');
      var inner = idx < currentIndex ? icon('check', 12) : String(idx + 1);
      return '<div class="tracker__step ' + cls + '"><div class="tracker__dot">' + inner + '</div>'
        + '<div class="tracker__label">' + escapeHtml(step) + '</div></div>';
    }).join('') + '</div>';
  }

  function metaItem(label, value) {
    return '<div class="meta-item"><div class="meta-item__label">' + escapeHtml(label) + '</div>'
      + '<div class="meta-item__value">' + value + '</div></div>';
  }

  function miniBar(percent, tone) {
    var colors = { success: 'var(--green-500)', warning: 'var(--amber-500)', danger: 'var(--red-500)', primary: 'var(--petrol-500)' };
    return '<div class="bar-mini"><div class="bar-mini__fill" style="width:'
      + Math.max(0, Math.min(100, percent)) + '%;background:' + (colors[tone] || colors.primary) + '"></div></div>';
  }

  function checkItem(item) {
    var status = String(item.status || 'PASS').toLowerCase();
    var iconName = status === 'pass' ? 'check' : (status === 'warning' ? 'alert' : 'x');
    return '<div class="check-item">'
      + '<span class="check-item__icon check-item__icon--' + status + '">' + icon(iconName, 11) + '</span>'
      + '<div><div class="check-item__label">' + escapeHtml(item.label) + '</div>'
      + (item.message ? '<div class="check-item__msg">' + escapeHtml(item.message) + '</div>' : '') + '</div></div>';
  }

  return {
    escapeHtml: escapeHtml, icon: icon, fmt: fmt, badge: badge, statusBadge: statusBadge,
    riskBadge: riskBadge, delta: delta, kpiCard: kpiCard, emptyState: emptyState, alert: alert,
    skeletonKpi: skeletonKpi, skeletonTable: skeletonTable, skeletonChart: skeletonChart,
    table: table, pagination: pagination, progressTracker: progressTracker, metaItem: metaItem,
    miniBar: miniBar, checkItem: checkItem, TONE_BY_STATUS: TONE_BY_STATUS
  };
})();


/* =========================================================================
   Charts — renderer SVG ringan, responsif, dengan tooltip & drill-down.
   ========================================================================= */
var Charts = (function () {

  var PALETTE = ['#1A6B96', '#1E9E6A', '#6F5BD1', '#C7891F', '#D1494F', '#0B1E2D'];
  var tipEl = null;
  var registry = [];

  function tip() {
    if (!tipEl) tipEl = document.getElementById('chart-tip');
    return tipEl;
  }

  function showTip(event, html) {
    var el = tip();
    if (!el) return;
    el.innerHTML = html;
    el.classList.add('is-visible');
    var rect = el.getBoundingClientRect();
    var x = event.clientX + 14;
    var y = event.clientY - rect.height - 10;
    if (x + rect.width > window.innerWidth - 8) x = event.clientX - rect.width - 14;
    if (y < 8) y = event.clientY + 16;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  }

  function hideTip() {
    var el = tip();
    if (el) el.classList.remove('is-visible');
  }

  function niceMax(value) {
    if (value <= 0) return 10;
    var exp = Math.floor(Math.log(value) / Math.LN10);
    var base = Math.pow(10, exp);
    var normalized = value / base;
    var step = normalized <= 1 ? 1 : (normalized <= 2 ? 2 : (normalized <= 5 ? 5 : 10));
    return step * base;
  }

  function formatValue(value, format) {
    if (format === 'percent') return UI.fmt.percent(value, 2);
    if (format === 'currency') return UI.fmt.compactCurrency(value);
    return UI.fmt.number(value, 0);
  }

  function svgEl(tag, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  /** Render ulang seluruh chart (dipanggil saat resize). */
  function refreshAll() {
    registry.forEach(function (entry) {
      if (document.body.contains(entry.container)) draw(entry.container, entry.spec);
    });
    registry = registry.filter(function (entry) { return document.body.contains(entry.container); });
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(refreshAll, 180);
  });

  /** API utama: Charts.render(container, spec) */
  function render(container, spec) {
    if (!container) return;
    registry = registry.filter(function (entry) { return entry.container !== container; });
    registry.push({ container: container, spec: spec });
    draw(container, spec);
  }

  function draw(container, spec) {
    var type = spec.type || 'line';
    container.innerHTML = '';
    container.classList.add('chart');
    var width = container.clientWidth || 640;
    if (type === 'line' || type === 'bar' || type === 'group') drawCartesian(container, spec, width);
    else if (type === 'donut') drawDonut(container, spec, width);
    else if (type === 'hbar') drawHbar(container, spec);
  }

  // ---- Cartesian (line / bar / grouped bar) -------------------------------
  function drawCartesian(container, spec, width) {
    var labels = spec.labels || [];
    var series = spec.series || [];
    var pad = { l: 46, r: 14, t: 14, b: 26 };

    // Label sumbu X: dipotong bila sempit, dan dimiringkan bila masih bertabrakan.
    var slotWidth = Math.max(1, (width - pad.l - pad.r) / Math.max(1, labels.length));
    var flatMax = Math.max(4, Math.floor(slotWidth / 6.2));
    var needsRotate = labels.some(function (l) { return String(l).length > flatMax; });
    // Label miring memiliki ruang diagonal, jadi batas karakternya dilonggarkan
    // (baris paralel berjarak slot × sin30° sehingga tetap tidak bertabrakan).
    var maxChars = needsRotate ? 16 : flatMax;
    if (needsRotate) pad.b = 64;

    var height = (spec.height || 240) + (needsRotate ? 32 : 0);
    var plotW = Math.max(40, width - pad.l - pad.r);
    var plotH = height - pad.t - pad.b;

    var maxValue = 0;
    series.forEach(function (s) {
      (s.values || []).forEach(function (v) { maxValue = Math.max(maxValue, Number(v) || 0); });
    });
    if (spec.target) maxValue = Math.max(maxValue, spec.target);
    var top = niceMax(maxValue * 1.15) || 10;

    var svg = svgEl('svg', { width: width, height: height, viewBox: '0 0 ' + width + ' ' + height, role: 'img' });
    var yTo = function (v) { return pad.t + plotH - (Number(v) / top) * plotH; };

    // Grid + sumbu Y
    for (var g = 0; g <= 4; g++) {
      var value = (top / 4) * g;
      var y = yTo(value);
      svg.appendChild(svgEl('line', { x1: pad.l, y1: y, x2: width - pad.r, y2: y, class: 'chart__grid-line' }));
      var label = svgEl('text', { x: pad.l - 8, y: y + 3.5, 'text-anchor': 'end', class: 'chart__axis-label' });
      label.textContent = spec.format === 'percent' ? UI.fmt.decimal(value, 1) : UI.fmt.compact(value);
      svg.appendChild(label);
    }

    // Sumbu X
    var slot = plotW / Math.max(1, labels.length);
    labels.forEach(function (label, i) {
      var full = String(label);
      var shown = full.length > maxChars ? full.substring(0, Math.max(1, maxChars - 1)) + '…' : full;
      var cx = pad.l + slot * i + slot / 2;
      var cy = height - (needsRotate ? 14 : 8);
      var text = svgEl('text', {
        x: cx, y: cy, 'text-anchor': needsRotate ? 'end' : 'middle',
        class: 'chart__axis-label chart__axis-x'
      });
      if (needsRotate) text.setAttribute('transform', 'rotate(-30 ' + cx + ' ' + cy + ')');
      text.textContent = shown;
      // <title> hanya ditambahkan bila label benar-benar dipotong, agar
      // textContent tetap bersih untuk pembaca layar dan pengujian.
      if (shown !== full) {
        var tooltip = svgEl('title', {});
        tooltip.textContent = full;
        text.appendChild(tooltip);
      }
      svg.appendChild(text);
    });

    // Target line
    if (spec.target) {
      var ty = yTo(spec.target);
      svg.appendChild(svgEl('line', { x1: pad.l, y1: ty, x2: width - pad.r, y2: ty, class: 'chart__target-line' }));
      var tLabel = svgEl('text', { x: width - pad.r, y: ty - 5, 'text-anchor': 'end', class: 'chart__axis-label' });
      tLabel.setAttribute('fill', '#C7891F');
      tLabel.textContent = 'Target ' + formatValue(spec.target, spec.format);
      svg.appendChild(tLabel);
    }

    if (spec.type === 'line') {
      series.forEach(function (s, si) {
        var color = s.color || PALETTE[si % PALETTE.length];
        var points = (s.values || []).map(function (v, i) {
          return { x: pad.l + slot * i + slot / 2, y: yTo(v), v: v };
        });
        if (points.length > 1) {
          var area = 'M' + points[0].x + ',' + (pad.t + plotH) + points.map(function (p) {
            return 'L' + p.x + ',' + p.y;
          }).join('') + 'L' + points[points.length - 1].x + ',' + (pad.t + plotH) + 'Z';
          svg.appendChild(svgEl('path', { d: area, fill: color, opacity: si === 0 ? .08 : .04 }));
        }
        var line = points.map(function (p, i) { return (i ? 'L' : 'M') + p.x + ',' + p.y; }).join('');
        svg.appendChild(svgEl('path', {
          d: line, fill: 'none', stroke: color, 'stroke-width': 2,
          'stroke-linecap': 'round', 'stroke-linejoin': 'round'
        }));
        points.forEach(function (p, i) {
          var dot = svgEl('circle', { cx: p.x, cy: p.y, r: 3.2, fill: '#fff', stroke: color, 'stroke-width': 2, class: 'chart__point' });
          svg.appendChild(dot);
        });
      });
    } else {
      var groupCount = series.length;
      var barGap = 4;
      var barW = Math.max(6, (slot * .62 - barGap * (groupCount - 1)) / groupCount);
      series.forEach(function (s, si) {
        var color = s.color || PALETTE[si % PALETTE.length];
        (s.values || []).forEach(function (v, i) {
          var h = Math.max(0, (Number(v) / top) * plotH);
          var x = pad.l + slot * i + slot / 2 - (barW * groupCount + barGap * (groupCount - 1)) / 2 + si * (barW + barGap);
          svg.appendChild(svgEl('rect', {
            x: x, y: pad.t + plotH - h, width: barW, height: h, rx: 3, fill: color, class: 'chart__bar'
          }));
        });
      });
    }

    // Hover zone per kolom (tooltip + drill-down)
    labels.forEach(function (label, i) {
      var zone = svgEl('rect', {
        x: pad.l + slot * i, y: pad.t, width: slot, height: plotH, fill: 'transparent',
        style: spec.onSelect ? 'cursor:pointer' : ''
      });
      zone.addEventListener('mousemove', function (event) {
        var rows = series.map(function (s, si) {
          return '<div class="chart-tip__row"><span>'
            + '<span style="display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;background:'
            + (s.color || PALETTE[si % PALETTE.length]) + '"></span>' + UI.escapeHtml(s.name) + '</span><b>'
            + formatValue((s.values || [])[i], s.format || spec.format) + '</b></div>';
        }).join('');
        showTip(event, '<div class="chart-tip__title">' + UI.escapeHtml(label) + '</div>' + rows);
      });
      zone.addEventListener('mouseleave', hideTip);
      if (spec.onSelect) {
        zone.addEventListener('click', function () {
          hideTip();
          spec.onSelect((spec.keys && spec.keys[i]) || label, i);
        });
      }
      svg.appendChild(zone);
    });

    container.appendChild(svg);

    if (series.length > 1 || spec.showLegend) {
      var legend = document.createElement('div');
      legend.className = 'chart__legend';
      legend.innerHTML = series.map(function (s, si) {
        return '<span class="chart__legend-item"><span class="chart__legend-dot" style="background:'
          + (s.color || PALETTE[si % PALETTE.length]) + '"></span>' + UI.escapeHtml(s.name) + '</span>';
      }).join('');
      container.appendChild(legend);
    }
  }

  // ---- Donut --------------------------------------------------------------
  function drawDonut(container, spec, width) {
    var items = (spec.items || []).filter(function (i) { return Number(i.value) > 0; });
    var size = Math.min(spec.size || 168, width);
    var total = items.reduce(function (sum, i) { return sum + Number(i.value); }, 0);

    var wrap = document.createElement('div');
    wrap.className = 'donut-wrap';

    var chartBox = document.createElement('div');
    chartBox.style.flex = '0 0 auto';

    if (!total) {
      wrap.innerHTML = '<div class="caption" style="padding:24px 0">Belum ada data untuk ditampilkan.</div>';
      container.appendChild(wrap);
      return;
    }

    var svg = svgEl('svg', { width: size, height: size, viewBox: '0 0 100 100' });
    var toneColor = {
      success: '#1E9E6A', warning: '#C7891F', danger: '#D1494F',
      primary: '#1A6B96', purple: '#6F5BD1', muted: '#93A1B0'
    };
    var angle = -Math.PI / 2;
    items.forEach(function (item, idx) {
      var portion = Number(item.value) / total;
      var end = angle + portion * Math.PI * 2;
      var large = portion > .5 ? 1 : 0;
      var r = 42, ri = 26, cx = 50, cy = 50;
      var x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
      var x2 = cx + r * Math.cos(end), y2 = cy + r * Math.sin(end);
      var x3 = cx + ri * Math.cos(end), y3 = cy + ri * Math.sin(end);
      var x4 = cx + ri * Math.cos(angle), y4 = cy + ri * Math.sin(angle);
      var d = 'M' + x1 + ',' + y1 + 'A' + r + ',' + r + ' 0 ' + large + ' 1 ' + x2 + ',' + y2
        + 'L' + x3 + ',' + y3 + 'A' + ri + ',' + ri + ' 0 ' + large + ' 0 ' + x4 + ',' + y4 + 'Z';
      var path = svgEl('path', {
        d: d, fill: item.color || toneColor[item.tone] || PALETTE[idx % PALETTE.length],
        style: spec.onSelect ? 'cursor:pointer' : ''
      });
      path.addEventListener('mousemove', function (event) {
        showTip(event, '<div class="chart-tip__title">' + UI.escapeHtml(item.label) + '</div>'
          + '<div class="chart-tip__row"><span>Jumlah</span><b>' + UI.fmt.number(item.value) + '</b></div>'
          + '<div class="chart-tip__row"><span>Porsi</span><b>' + UI.fmt.percent(portion * 100, 1) + '</b></div>');
      });
      path.addEventListener('mouseleave', hideTip);
      if (spec.onSelect) path.addEventListener('click', function () { hideTip(); spec.onSelect(item.id, item); });
      svg.appendChild(path);
      angle = end;
    });

    var totalText = svgEl('text', { x: 50, y: 48, 'text-anchor': 'middle' });
    totalText.setAttribute('font-size', '15');
    totalText.setAttribute('font-weight', '700');
    totalText.setAttribute('fill', '#10233A');
    totalText.textContent = UI.fmt.compact(total);
    svg.appendChild(totalText);
    var capText = svgEl('text', { x: 50, y: 60, 'text-anchor': 'middle' });
    capText.setAttribute('font-size', '7');
    capText.setAttribute('fill', '#6B7C8F');
    capText.textContent = spec.totalLabel || 'TOTAL';
    svg.appendChild(capText);

    chartBox.appendChild(svg);
    wrap.appendChild(chartBox);

    var legend = document.createElement('div');
    legend.className = 'donut-legend';
    legend.innerHTML = items.map(function (item, idx) {
      var color = item.color || toneColor[item.tone] || PALETTE[idx % PALETTE.length];
      return '<div class="donut-legend__item" data-donut-id="' + UI.escapeHtml(item.id || '') + '">'
        + '<span class="donut-legend__dot" style="background:' + color + '"></span>'
        + '<span>' + UI.escapeHtml(item.label) + '</span>'
        + '<span class="donut-legend__value num">' + UI.fmt.number(item.value) + '</span></div>';
    }).join('');
    if (spec.onSelect) {
      legend.addEventListener('click', function (event) {
        var row = event.target.closest('[data-donut-id]');
        if (row) spec.onSelect(row.getAttribute('data-donut-id'));
      });
    }
    wrap.appendChild(legend);
    container.appendChild(wrap);
  }

  // ---- Horizontal bar ----------------------------------------------------
  function drawHbar(container, spec) {
    var items = spec.items || [];
    if (!items.length) {
      container.innerHTML = '<div class="caption" style="padding:20px 0">Belum ada data untuk ditampilkan.</div>';
      return;
    }
    var max = items.reduce(function (m, i) { return Math.max(m, Number(i.value) || 0); }, 0) || 1;
    var list = document.createElement('div');
    list.className = 'hbar-list';
    list.innerHTML = items.map(function (item) {
      var pct = (Number(item.value) / max) * 100;
      var color = item.color || (spec.tone === 'danger' ? '#D1494F' : '#1A6B96');
      return '<div class="hbar" data-hbar-id="' + UI.escapeHtml(item.id || '') + '" title="'
        + UI.escapeHtml(item.label) + '">'
        + '<span class="hbar__label">' + UI.escapeHtml(item.label) + '</span>'
        + '<span class="hbar__track"><span class="hbar__fill" style="width:' + pct + '%;background:' + color + '"></span></span>'
        + '<span class="hbar__value num">' + formatValue(item.value, item.format || spec.format) + '</span></div>';
    }).join('');
    if (spec.onSelect) {
      list.addEventListener('click', function (event) {
        var row = event.target.closest('[data-hbar-id]');
        if (row) spec.onSelect(row.getAttribute('data-hbar-id'));
      });
    }
    container.appendChild(list);
  }

  return { render: render, refreshAll: refreshAll, PALETTE: PALETTE, hideTip: hideTip };
})();
</script>
